<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Upload ảnh với Supabase</title>
</head>
<body>
  <h2>Upload ảnh</h2>
  <input type="file" id="fileInput" />
  <br><br>
  <img id="preview" style="max-width:300px;" />

  <script type="module">
    import { createClient } from "sb_publishable_7JiKHmLhM3ZQrY60FqTP4w_JP_SuZvW"

    const supabaseUrl = "YOUR_PROJECT_URL"
    const supabaseKey = "YOUR_ANON_KEY"
    const supabase = createClient(supabaseUrl, supabaseKey)

    document.getElementById("fileInput").addEventListener("change", async (e) => {
      const file = e.target.files[0]
      const fileName = Date.now() + "-" + file.name

      // Upload vào bucket "images"
      const { error } = await supabase.storage
        .from("images")
        .upload(fileName, file)

      if (error) {
        console.error("Upload lỗi:", error)
        return
      }

      // Lấy public URL
      const { data } = supabase.storage
        .from("images")
        .getPublicUrl(fileName)

      document.getElementById("preview").src = data.publicUrl
      console.log("Ảnh công khai:", data.publicUrl)
    })
  </script>
</body>
</html>
