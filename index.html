<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Upload ảnh với Supabase</title>
</head>
<body>
  <h2>Upload ảnh</h2>
  <input type="file" id="fileInput" />
  <br><br>
  <img id="preview" style="max-width:300px;" />

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

    // Thay bằng URL project của bạn (lấy trong Supabase Dashboard → Settings → API)
    const supabaseUrl = "https://jfuqlboofxijjkaawslw.supabase.co"

    // Đây chính là key bạn đưa
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmdXFsYm9vZnhpamprYWF3c2x3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTMxMTIsImV4cCI6MjEwNjk2OTExMn0.S83Po1qpyvSSKb-zOf3F6ZpaIiBTmOSUQuVBYN2TFmw"

    // Tạo client để kết nối Supabase
    const supabase = createClient(supabaseUrl, supabaseKey)

    // Upload ảnh khi chọn file
    document.getElementById("fileInput").addEventListener("change", async (e) => {
      const file = e.target.files[0]
      if (!file) return

      const fileName = Date.now() + "-" + file.name

      const { error } = await supabase.storage
        .from("images") // tên bucket bạn tạo
        .upload(fileName, file)

      if (error) {
        console.error("Upload lỗi:", error)
        alert("Upload thất bại: " + error.message)
        return
      }

      const { data } = supabase.storage
        .from("images")
        .getPublicUrl(fileName)

      document.getElementById("preview").src = data.publicUrl
      console.log("Ảnh công khai:", data.publicUrl)
    })
  </script>
</body>
</html>
